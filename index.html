<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StayMatch — Find the Hotel That Fits You Best</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>
 
<!-- ============ NAV ============ -->
<header class="nav" id="top">
  <div class="nav-inner">
    <a href="#top" class="logo">Stay<span>Match</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="#top">Home</a>
      <a href="#compare">Compare Hotels</a>
      <a href="#how-it-works">How It Works</a>
      <a href="#about">About</a>
    </nav>
    <button class="btn btn-primary nav-cta" id="navFindBtn">Find My Best Hotel</button>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ============ COMPARE / FILTERS ============ -->
<section class="compare" id="compare">
  <div class="section-inner">
    <p class="eyebrow">Step two</p>
    <h2>Compare Your Matches</h2>
 
    <div class="filters">
      <div class="filter-field">
        <label for="searchInput">Search</label>
        <input type="text" id="searchInput" placeholder="Hotel name or location…">
      </div>
      <div class="filter-field">
        <label for="maxPriceInput">Maximum price (KES/night)</label>
        <input type="number" id="maxPriceInput" placeholder="e.g. 10000" min="0">
      </div>
      <div class="filter-field">
        <label for="minRatingInput">Minimum rating</label>
        <select id="minRatingInput">
          <option value="0">Any</option>
          <option value="3">3.0+</option>
          <option value="3.5">3.5+</option>
          <option value="4">4.0+</option>
          <option value="4.5">4.5+</option>
        </select>
      </div>
      <button class="btn btn-ghost" id="resetFiltersBtn">Reset filters</button>
    </div>
 
    <p class="results-count" id="resultsCount"></p>
 
    <div class="hotel-grid" id="hotelGrid"></div>
    <p class="no-results" id="noResults" hidden>No hotels match your current filters.</p>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
